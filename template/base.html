<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facility Search</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<!-- INJECT_CSS -->
</head>
<body>
<div id="app">
  <header id="app-header">
    <h1 id="app-title">Facility Search</h1>
    <div id="search-panel" class="fag-hidden">
      <input type="text" id="search-input" placeholder="Search by facility name…">
      <div id="search-dropdown">
        <span id="search-count" class="fag-hidden"></span>
        <ul id="search-results" class="fag-hidden"></ul>
      </div>
    </div>
  </header>
  <div id="app-body">
    <main id="map-pane">
      <div id="map"></div>
      <!-- Visible in the initial markup (no fag-hidden), so it paints
           before any script runs - a large export otherwise showed a
           blank white rectangle for the whole load. layer-control.js
           updates the count and removes it when every layer is built. -->
      <div id="loading-overlay">
        <div id="loading-box">
          <div id="loading-spinner"></div>
          <div id="loading-text">Loading…</div>
        </div>
      </div>
      <!-- Shown whenever grid thinning is actually hiding something.
           Silently dropping features reads as missing data, so this is
           not optional (spec item 6-B). -->
      <div id="thinning-notice" class="fag-hidden">
        Showing some features only — zoom in to see them all
      </div>
      <div id="layer-panel" class="fag-hidden">
        <div id="layer-panel-header">
          <span id="layer-panel-title">Layers</span>
          <button id="layer-panel-toggle" type="button" aria-label="Toggle layer panel">▾</button>
        </div>
        <ul id="layer-panel-list"></ul>
      </div>
      <div id="feature-table-panel" class="fag-hidden fag-collapsed">
        <!-- First child, so the panel's column-reverse layout puts this
             at the very bottom - it stays visible while the table
             itself is collapsed. -->
        <div id="selection-bar" class="fag-hidden">
          <div id="selection-bar-row">
            <button id="selection-rect-btn" type="button" title="Drag a rectangle on the map to select features">▭ Select area</button>
            <span id="selection-count">None selected</span>
            <button id="selection-clear-btn" type="button" title="Clear the selection">Clear</button>
          </div>
          <div id="selection-bar-row-2">
            <button id="export-csv-selected" type="button" title="Export the selected features as CSV">CSV (selected)</button>
            <button id="export-csv-all" type="button" title="Export every feature of the layer shown in the table as CSV">CSV (layer)</button>
            <button id="export-geojson-selected" type="button" title="Export the selected features as GeoJSON">GeoJSON (selected)</button>
            <button id="export-geojson-all" type="button" title="Export every feature of the layer shown in the table as GeoJSON">GeoJSON (layer)</button>
          </div>
        </div>
        <div id="feature-table-header">
          <select id="feature-table-layer-select"></select>
          <span id="feature-table-count"></span>
          <button id="feature-table-toggle" type="button" aria-label="Toggle feature table">▾</button>
        </div>
        <!-- Hand-rolled virtual scroll (v0.3.0 task 3-2, see point-list.js):
             one scrolling element for both axes so the sticky header row
             shares horizontal scroll with the body while staying pinned
             vertically; #feature-table-rows only ever holds the rows
             currently in view, absolutely positioned inside a full-height
             spacer so the scrollbar's size/position stays correct. -->
        <div id="feature-table-scroll">
          <div id="feature-table-cols" class="fag-table-row fag-table-row-head"></div>
          <div id="feature-table-spacer">
            <div id="feature-table-rows"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- INJECT_CONFIG -->
<!-- INJECT_LAYERS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- INJECT_SCRIPTS -->
</body>
</html>
